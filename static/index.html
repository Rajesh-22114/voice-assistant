<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEO AI Assistant - Enterprise Voice Controlled Dashboard</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            },
            accent: {
              cyan: '#06b6d4',
              purple: '#8b5cf6',
              emerald: '#10b981',
              rose: '#f43f5e'
            },
            dark: {
              bg: '#090d16',
              card: 'rgba(15, 23, 42, 0.75)',
              border: 'rgba(51, 65, 85, 0.4)'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="/static/styles.css?v=3.0" />
</head>
<body class="bg-[#070a12] text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-white min-h-screen overflow-x-hidden">
  
  <!-- Root Container -->
  <div id="root">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; font-family: 'Outfit', sans-serif;">
      <div style="width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #06b6d4, #3b82f6); margin: 0 auto 16px auto; animation: pulse 1.5s infinite ease-in-out; box-shadow: 0 0 30px rgba(6,182,212,0.5);"></div>
      <h2 style="font-size: 24px; font-weight: 700; color: #ffffff;">LEO <span style="color: #06b6d4;">AI</span> Assistant</h2>
      <p style="color: #94a3b8; font-size: 14px; margin-top: 8px;">Loading Dashboard...</p>
    </div>
  </div>

  <style>
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
  </style>

  <!-- Babel Standalone Transpiler -->
  <script src="/babel_standalone.js"></script>

  <!-- React Application Script -->
  <script type="text/babel" src="/static/app.js?v=7.0"></script>

</body>
</html>
